name: Device Smoke (manual)

# Manual-only diagnostic: install the published release APK on an ARM64
# emulator, launch it, and capture logcat so cold-start crashes can be
# diagnosed from a real stack trace. Never runs automatically.

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Launch published APK on ARM64 emulator
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download published online APK (v3.2.13)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release download v3.2.13 -p app-online-release.apk -R mazharmnzoor4227-beep/vayro
          ls -l app-online-release.apk

      - name: Install and launch on ARM64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: |
            set -x
            adb install -r app-online-release.apk || echo "INSTALL_FAILED"
            adb logcat -c || true
            adb shell monkey -p com.vayro.app -c android.intent.category.LAUNCHER 1 || true
            sleep 25
            echo "=== PIDOF com.vayro.app ==="
            adb shell pidof com.vayro.app || echo "PROCESS_NOT_RUNNING"
            adb logcat -d > logcat.txt || true
            echo "=== FATAL / AndroidRuntime excerpts ==="
            grep -n -A 45 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -n 400 || echo "NO_FATAL_EXCEPTION_FOUND"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-smoke-logcat
          path: logcat.txt
          if-no-files-found: warn
